
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK Creative Agency</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 50px 20px;
        }
        .container {
            padding: 40px 20px;
        }
        .services {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 250px;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<header>
    <h1>مرحباً بك في MK Creative Agency</h1>
    <p>نحن نحول أفكارك إلى واقع رقمي مبدع</p>
</header>

<div class="container">
    <h2>خدماتنا</h2>
    <div class="services">
        <div class="card">
            <h3>صناعة المحتوى</h3>
            <p>إيديت احترافي وفيديوهات قصيرة جذابة.</p>
        </div>
        <div class="card">
            <h3>برمجة وتطوير</h3>
            <p>حلول برمجية وتطبيقات ويب مخصصة.</p>
        </div>
        <div class="card">
            <h3>أتمتة العمل</h3>
            <p>تسهيل مهامك اليومية بأدوات ذكية.</p>
        </div>
    </div>
    
    <a href="mailto:your-email@example.com" class="btn">تواصل معنا الآن</a>
</div>

</body>
</html>
